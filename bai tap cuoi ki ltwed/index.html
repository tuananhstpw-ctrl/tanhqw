<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Security Checker Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <h1>🔐 Security Checker Pro</h1>

    <!-- PASSWORD CHECK -->
    <div class="card">
        <h2>Kiểm tra mật khẩu</h2>

        <div class="password-box">
            <input type="password" id="password" placeholder="Nhập mật khẩu..." oninput="liveCheck()">
            <span class="toggle" onclick="togglePassword()">👁</span>
        </div>

        <div class="strength-bar">
            <div id="strengthFill"></div>
        </div>

        <ul class="requirements">
            <li id="length">❌ Tối thiểu 8 ký tự</li>
            <li id="upper">❌ Có chữ in hoa</li>
            <li id="lower">❌ Có chữ thường</li>
            <li id="number">❌ Có số</li>
            <li id="special">❌ Có ký tự đặc biệt</li>
        </ul>

        <button onclick="checkPassword()">Kiểm tra</button>
        <p id="passwordResult"></p>
        <p id="passwordExplain"></p>
    </div>

    <!-- WEBSITE CHECK -->
    <div class="card">
        <h2>Phân tích đường link</h2>

        <input type="text" id="url" placeholder="Nhập đường link...">
        <button onclick="checkURL()">Phân tích</button>

        <div class="risk-bar">
            <div id="riskFill"></div>
        </div>

        <p id="urlResult"></p>
        <p id="urlExplain"></p>
    </div>

    <!-- HISTORY -->
    <div class="card">
        <h2>Lịch sử kiểm tra</h2>
        <ul id="history"></ul>
    </div>

    <!-- CHART -->
    <div class="card">
        <h2>Thống kê mật khẩu</h2>
        <canvas id="myChart"></canvas>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
